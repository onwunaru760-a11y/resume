  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Source+Serif+4:opsz,wght@8..60,500;8..60,600;8..60,700&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap">

  <style>
    :root {
      --paper: #F7F7F4;
      --paper-raised: #FFFFFF;
      --ink: #1B2430;
      --ink-soft: #5B6472;
      --rule: #DDE1E2;
      --rule-strong: #BCC2C4;
      --teal: #146C64;
      --teal-soft: #E3EFED;
      --flag: #A6402F;
      --flag-soft: #F3E4E0;

      --font-display: "Source Serif 4", Georgia, serif;
      --font-body: "IBM Plex Sans", -apple-system, sans-serif;
      --font-mono: "IBM Plex Mono", "Courier New", monospace;
    }

    * { box-sizing: border-box; }
    html { -webkit-font-smoothing: antialiased; }

    body {
      margin: 0;
      background: var(--paper);
      color: var(--ink);
      font-family: var(--font-body);
      font-size: 17px;
      line-height: 1.6;
    }

    a { color: var(--teal); text-decoration: none; }
    a:hover { text-decoration: underline; }
    :focus-visible { outline: 2px solid var(--teal); outline-offset: 2px; }

    @media (prefers-reduced-motion: reduce) {
      * { animation: none !important; transition: none !important; }
    }

    .wrap {
      max-width: 700px;
      margin: 0 auto;
      padding: 56px 24px 80px;
    }

    /* ---------- header ---------- */

    .header {
      display: flex;
      gap: 24px;
      align-items: center;
      margin-bottom: 20px;
    }

    .header img {
      width: 84px;
      height: 84px;
      border-radius: 4px;
      object-fit: cover;
      border: 1px solid var(--rule);
    }

    .header h1 {
      font-family: var(--font-display);
      font-size: 1.9rem;
      font-weight: 600;
      margin: 0 0 4px;
      letter-spacing: -0.01em;
    }

    .header .role {
      font-size: 1.02rem;
      color: var(--ink-soft);
      max-width: 42ch;
    }

    .linkedin-line {
      margin: 14px 0 22px;
      font-size: 0.95rem;
    }

    .status-chip {
      display: inline-block;
      font-family: var(--font-mono);
      font-size: 0.8rem;
      color: var(--ink-soft);
      border: 1px solid var(--rule);
      border-radius: 2px;
      padding: 4px 10px;
      margin-bottom: 36px;
    }

    /* ---------- section chrome ---------- */

    h2.section-title {
      font-family: var(--font-mono);
      font-size: 0.78rem;
      letter-spacing: 0.04em;
      color: var(--ink-soft);
      text-transform: none;
      margin: 0 0 18px;
      padding-bottom: 10px;
      border-bottom: 1px solid var(--rule);
    }

    section { margin-bottom: 48px; }

    .about p {
      font-size: 1.03rem;
      max-width: 62ch;
    }

    /* ---------- case files (projects) ---------- */

    .case {
      border: 1px solid var(--rule);
      border-radius: 4px;
      background: var(--paper-raised);
      padding: 22px 24px;
      margin-bottom: 18px;
    }

    .case h3 {
      font-family: var(--font-display);
      font-size: 1.2rem;
      margin: 0 0 4px;
    }

    .case .stack {
      font-family: var(--font-mono);
      font-size: 0.78rem;
      color: var(--ink-soft);
      margin-bottom: 14px;
    }

    .case dl { margin: 0; }

    .case dt {
      font-family: var(--font-mono);
      font-size: 0.75rem;
      color: var(--teal);
      margin-top: 12px;
    }

    .case dt.flag { color: var(--flag); }

    .case dd {
      margin: 4px 0 0;
      font-size: 0.96rem;
    }

    .case .case-link {
      display: inline-block;
      margin-top: 16px;
      font-size: 0.92rem;
      font-weight: 500;
    }

    /* ---------- history / background ---------- */

    .history-item {
      margin-bottom: 26px;
    }

    .history-item h3 {
      font-size: 1.05rem;
      margin: 0 0 2px;
      font-weight: 600;
    }

    .history-item .sub {
      color: var(--ink-soft);
      font-size: 0.92rem;
      margin-bottom: 8px;
    }

    .history-item p { font-size: 0.96rem; max-width: 60ch; margin: 8px 0; }

    .upwork-stats {
      display: flex;
      gap: 18px;
      flex-wrap: wrap;
      font-family: var(--font-mono);
      font-size: 0.85rem;
      color: var(--ink-soft);
      margin-top: 6px;
    }

    /* ---------- skills ---------- */

    .skills-list {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
    }

    .skill-tag {
      font-family: var(--font-mono);
      font-size: 0.85rem;
      border: 1px solid var(--rule);
      border-radius: 2px;
      padding: 6px 12px;
      background: var(--paper-raised);
    }

    /* ---------- referral / footer ---------- */

    .referral p {
      font-size: 1.02rem;
      max-width: 55ch;
    }

    .footer-links {
      display: flex;
      gap: 20px;
      flex-wrap: wrap;
      margin: 18px 0 24px;
    }

    .footer-links a {
      font-weight: 600;
    }

    .contact-line {
      font-family: var(--font-mono);
      font-size: 0.85rem;
      color: var(--ink-soft);
      border-top: 1px solid var(--rule);
      padding-top: 18px;
    }

    @media (max-width: 520px) {
      .header { flex-direction: column; align-items: flex-start; }
    }
  </style>
</head>

      </div>

  </main>
</body>
